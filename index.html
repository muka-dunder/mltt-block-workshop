<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MLTT Block Workshop</title>
</head>
<body>
<header>
  <div class="brand">MLTT<span>Block Workshop</span></div>
  <div class="level-head">
    <div class="level-title" id="levelTitle">L0</div>
    <div class="level-tag" id="levelTag"></div>
  </div>
  <div class="nav">
    <button id="prevBtn" class="ghost" title="Previous level">◀</button>
    <select id="levelSelect" aria-label="Select level"></select>
    <button id="nextBtn2" class="ghost" title="Next level">▶</button>
  </div>
  <div class="workspace-controls">
    <select id="modeSelect" aria-label="Canvas mode"><option value="level">关卡模式</option><option value="custom">自定义模式</option></select>
    <select id="languageSelect" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option></select>
    <select id="librarySelect" aria-label="Block library"><option value="common">积木：本关常用</option><option value="all">积木：全部</option></select>
  </div>
  <div class="actions">
    <a class="github-link" href="https://github.com/muka-dunder/mltt-block-workshop" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
    <button id="shareBtn" class="ghost" type="button">分享当前局面</button>
    <button id="checkBtn" class="primary">Check</button>
    <button id="resetBtn" class="ghost">Reset</button>
  </div>
</header>

<main>
  <div id="blocklyDiv"></div>
  <aside id="workshopPanel" aria-label="构造工作坊">
    <details class="workshop-details" open>
      <summary><span data-workshop-text="workshopTitle">构造工作坊</span></summary>
      <div class="workshop-content">
        <p id="levelStory" class="story"></p>
        <button id="viewAnswerBtn" class="ghost view-answer" type="button">查看答案</button>
        <section aria-labelledby="notesTitle">
          <h2 id="notesTitle" data-workshop-text="notesTitle">画布注释</h2>
          <div class="note-actions">
            <button id="addNote" type="button" data-workshop-text="addNote">＋ 注释</button>
          </div>
          <small data-workshop-text="notesHelp">注释可以拖动、折叠和附着到积木。你的笔记会自动保存，重置答案也会保留。</small>
        </section>
        <section aria-labelledby="selectionTitle">
          <h2 id="selectionTitle" data-workshop-text="selectionTitle">所选项的类型</h2>
          <div id="selectionInfo" aria-live="polite"></div>
        </section>
      </div>
    </details>
  </aside>
  <div id="status" class="status idle">Drag a term into the answer slot on the canvas, then press Check.</div>
</main>

<div id="overlay" class="overlay">
  <div class="win">
    <div class="win-text" id="winText"></div>
    <div class="win-actions">
      <button id="winClose" class="ghost">Stay here</button>
      <button id="nextBtn" class="primary">Next level →</button>
    </div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
